# Environment configuration for Vehicle Rental System
# Copy this file to application-local.properties or set as environment variables

# Database connection
DB_URL=jdbc:mysql://localhost:3306/vehicle_rental?serverTimezone=Asia/Kolkata
DB_USERNAME=root
# DB_PASSWORD MUST be provided in your environment. It has no default!
DB_PASSWORD=your_secure_password

# File uploads directory (optional, defaults to 'uploads')
UPLOAD_DIR=uploads

# Database Seed Passwords (dev profile only)
SEED_ADMIN_PASSWORD=admin123
SEED_CUSTOMER_PASSWORD=password123
