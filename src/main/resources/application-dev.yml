spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/vehicle_rental?serverTimezone=Asia/Kolkata}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true

app:
  seed:
    admin:
      password: ${SEED_ADMIN_PASSWORD:admin123}
    customer:
      password: ${SEED_CUSTOMER_PASSWORD:password123}
