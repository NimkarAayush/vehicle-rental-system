<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{fragments/layout}" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>Delete Vehicle</title>
</head>
<body class="bg-light">
    <div layout:fragment="content" class="container py-5 d-flex align-items-center justify-content-center min-vh-75">
        <div class="col-md-6 col-lg-5" data-aos="zoom-in">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-body p-0 text-center">
                    <div class="bg-danger text-white py-5 position-relative">
                        <h1 class="display-1 mb-0"><i class="fa-solid fa-triangle-exclamation shake" style="animation-iteration-count: infinite; animation-duration: 3s;"></i></h1>
                        <svg class="position-absolute bottom-0 w-100" style="height: 40px;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="#ffffff" fill-opacity="1" d="M0,256L48,229.3C96,203,192,149,288,154.7C384,160,480,224,576,218.7C672,213,768,139,864,128C960,117,1056,171,1152,197.3C1248,224,1344,224,1392,224L1440,224L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>
                    </div>
                    
                    <div class="p-4 p-md-5 bg-white">
                        <h3 class="fw-bold mb-3 text-dark">Confirm Deletion</h3>
                        <p class="text-muted mb-4">Are you sure you want to permanently delete this vehicle? This action cannot be undone.</p>
                        
                        <div class="bg-light rounded-4 p-3 text-start mb-4 border shadow-sm">
                            <div class="d-flex align-items-center">
                                <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center shadow-sm me-3" style="width: 48px; height: 48px;">
                                    <i class="fa-solid fa-car"></i>
                                </div>
                                <div>
                                    <h5 class="fw-bold mb-0" th:text="${vehicle.brand + ' ' + vehicle.model}"></h5>
                                    <small class="text-muted font-monospace" th:text="${vehicle.registrationNumber}"></small>
                                </div>
                            </div>
                        </div>
                        
                        <form th:action="@{/admin/vehicles/delete/{id}(id=${vehicle.id})}" method="post">
                            <div class="d-flex gap-2 justify-content-center mt-2">
                                <a th:href="@{/admin/vehicles}" class="btn btn-light btn-lg rounded-pill px-4 fw-bold flex-grow-1">Cancel</a>
                                <button type="submit" class="btn btn-danger btn-lg rounded-pill px-4 fw-bold flex-grow-1 shadow-sm hover-lift"><i class="fa-solid fa-trash me-2"></i>Delete</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
