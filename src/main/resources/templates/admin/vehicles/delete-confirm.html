<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{fragments/layout}" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>Delete Vehicle</title>
</head>
<body>
    <div layout:fragment="content" class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-danger shadow-sm mt-4">
                <div class="card-header bg-danger text-white fw-bold">
                    Confirm Deletion
                </div>
                <div class="card-body p-4 text-center">
                    <h1 class="text-danger mb-3"><i class="fa-solid fa-triangle-exclamation"></i></h1>
                    <h4>Are you sure you want to delete this vehicle?</h4>
                    <div class="p-3 bg-light rounded mt-4 mb-4 text-start">
                        <p class="mb-1"><strong>Brand & Model:</strong> <span th:text="${vehicle.brand + ' ' + vehicle.model}"></span></p>
                        <p class="mb-1"><strong>Registration:</strong> <span th:text="${vehicle.registrationNumber}"></span></p>
                        <p class="mb-0"><strong>Status:</strong> <span th:text="${vehicle.status}"></span></p>
                    </div>
                    <p class="text-muted small">This action cannot be undone. If the vehicle has existing bookings, the deletion will be blocked to maintain data integrity.</p>
                    
                    <form th:action="@{/admin/vehicles/delete/{id}(id=${vehicle.id})}" method="post" class="mt-4">
                        <a th:href="@{/admin/vehicles}" class="btn btn-secondary me-2">Cancel</a>
                        <button type="submit" class="btn btn-danger fw-bold">Yes, Delete Vehicle</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
