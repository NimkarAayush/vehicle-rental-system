<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{fragments/layout}" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>Manage Bookings - Admin</title>
</head>
<body class="bg-light">
    <div layout:fragment="content" class="py-4 container-fluid px-4">
        
        <div class="d-flex justify-content-between align-items-end mb-4" data-aos="fade-down">
            <div>
                <h2 class="fw-bold mb-1"><i class="fa-solid fa-list-check text-primary me-2"></i>Booking Management</h2>
                <p class="text-muted mb-0">View and update booking lifecycle statuses.</p>
            </div>
        </div>

        <div class="card shadow-sm border-0 rounded-4 mb-4" data-aos="fade-up">
            <div class="card-body bg-white rounded-4 p-4">
                <form th:action="@{/admin/bookings}" method="get" class="row g-3 align-items-center no-loader">
                    <div class="col-md-5">
                        <select name="status" class="form-select bg-light border-0 shadow-none">
                            <option value="">All Statuses</option>
                            <option value="PENDING" th:selected="${statusFilter == 'PENDING'}">PENDING</option>
                            <option value="CONFIRMED" th:selected="${statusFilter == 'CONFIRMED'}">CONFIRMED</option>
                            <option value="ACTIVE" th:selected="${statusFilter == 'ACTIVE'}">ACTIVE</option>
                            <option value="COMPLETED" th:selected="${statusFilter == 'COMPLETED'}">COMPLETED</option>
                            <option value="CANCELLED" th:selected="${statusFilter == 'CANCELLED'}">CANCELLED</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <button type="submit" class="btn btn-secondary w-100 rounded-pill fw-bold">Filter Bookings</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm border-0 rounded-4" data-aos="fade-up" data-aos-delay="100">
            <div class="card-body p-0 table-responsive">
                <table class="table table-hover mb-0 align-middle border-light">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4 rounded-top-left-4 border-0 py-3 text-muted small text-uppercase tracking-wide">ID</th>
                            <th class="border-0 py-3 text-muted small text-uppercase tracking-wide">Customer</th>
                            <th class="border-0 py-3 text-muted small text-uppercase tracking-wide">Vehicle</th>
                            <th class="border-0 py-3 text-muted small text-uppercase tracking-wide">Dates</th>
                            <th class="border-0 py-3 text-muted small text-uppercase tracking-wide">Total</th>
                            <th class="border-0 py-3 text-muted small text-uppercase tracking-wide">Status</th>
                            <th class="text-end pe-4 rounded-top-right-4 border-0 py-3 text-muted small text-uppercase tracking-wide">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="booking : ${bookingPage.content}">
                            <td class="ps-4 fw-bold text-muted" th:text="${'#' + booking.id}"></td>
                            <td>
                                <div class="fw-bold text-dark" th:text="${booking.user.firstName + ' ' + booking.user.lastName}"></div>
                                <span class="text-muted small" th:text="${booking.user.email}"></span>
                            </td>
                            <td>
                                <div class="fw-bold text-dark" th:text="${booking.vehicle.brand + ' ' + booking.vehicle.model}"></div>
                                <span class="badge bg-light text-secondary border mt-1 font-monospace" th:text="${booking.vehicle.registrationNumber}"></span>
                            </td>
                            <td>
                                <div class="text-dark small"><i class="fa-solid fa-arrow-right-to-bracket text-success me-1"></i> <span th:text="${booking.startDate}"></span></div>
                                <div class="text-dark small mt-1"><i class="fa-solid fa-arrow-right-from-bracket text-danger me-1"></i> <span th:text="${booking.endDate}"></span></div>
                            </td>
                            <td class="fw-bold text-accent" th:text="${'$' + booking.totalPrice}"></td>
                            <td>
                                <span class="badge px-3 py-2 rounded-pill shadow-sm" th:classappend="${booking.status.name() == 'COMPLETED' ? 'bg-secondary' : (booking.status.name() == 'CANCELLED' ? 'bg-danger' : (booking.status.name() == 'ACTIVE' ? 'bg-primary' : 'bg-warning'))}" th:text="${booking.status}"></span>
                            </td>
                            <td class="text-end pe-4">
                                <div class="btn-group shadow-sm rounded-pill" th:if="${booking.status.name() != 'COMPLETED' and booking.status.name() != 'CANCELLED'}">
                                    <button type="button" class="btn btn-sm btn-light border dropdown-toggle fw-bold text-primary" data-bs-toggle="dropdown" aria-expanded="false">
                                        Action
                                    </button>
                                    <ul class="dropdown-menu dropdown-menu-end border-0 shadow rounded-3">
                                        <li th:if="${booking.status.name() == 'PENDING'}">
                                            <form th:action="@{/admin/bookings/{id}/confirm(id=${booking.id})}" method="post">
                                                <button type="submit" class="dropdown-item py-2 fw-medium"><i class="fa-solid fa-check text-success me-2"></i> Confirm</button>
                                            </form>
                                        </li>
                                        <li th:if="${booking.status.name() == 'CONFIRMED'}">
                                            <form th:action="@{/admin/bookings/{id}/start(id=${booking.id})}" method="post">
                                                <button type="submit" class="dropdown-item py-2 fw-medium"><i class="fa-solid fa-play text-primary me-2"></i> Start Rental</button>
                                            </form>
                                        </li>
                                        <li th:if="${booking.status.name() == 'ACTIVE'}">
                                            <form th:action="@{/admin/bookings/{id}/complete(id=${booking.id})}" method="post">
                                                <button type="submit" class="dropdown-item py-2 fw-medium"><i class="fa-solid fa-flag-checkered text-secondary me-2"></i> Complete</button>
                                            </form>
                                        </li>
                                        <li>
                                            <form th:action="@{/admin/bookings/{id}/cancel(id=${booking.id})}" method="post">
                                                <button type="submit" class="dropdown-item py-2 fw-medium text-danger"><i class="fa-solid fa-xmark me-2"></i> Cancel</button>
                                            </form>
                                        </li>
                                    </ul>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(bookingPage.content)}">
                            <td colspan="7" class="text-center py-5">
                                <div class="text-muted">
                                    <i class="fa-solid fa-inbox fa-3x mb-3 opacity-50"></i>
                                    <h5>No bookings found.</h5>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <!-- Pagination -->
            <div class="card-footer bg-white py-3 border-0 rounded-bottom-4" th:if="${bookingPage.totalPages > 1}">
                <nav>
                    <ul class="pagination justify-content-center mb-0">
                        <li class="page-item" th:classappend="${bookingPage.first ? 'disabled' : ''}">
                            <a class="page-link border-0" th:href="@{/admin/bookings(page=${bookingPage.number - 1}, status=${statusFilter})}">Prev</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, bookingPage.totalPages - 1)}" th:classappend="${i == bookingPage.number ? 'active' : ''}">
                            <a class="page-link border-0 rounded-circle mx-1" th:classappend="${i == bookingPage.number ? 'bg-primary text-white shadow-sm' : ''}" style="width: 35px; height: 35px; display: flex; align-items: center; justify-content: center;" th:href="@{/admin/bookings(page=${i}, status=${statusFilter})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${bookingPage.last ? 'disabled' : ''}">
                            <a class="page-link border-0" th:href="@{/admin/bookings(page=${bookingPage.number + 1}, status=${statusFilter})}">Next</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</body>
</html>
