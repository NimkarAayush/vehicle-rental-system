<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{fragments/layout}" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>Login - RideEasy</title>
    <style>
        .auth-cover {
            background: url('https://images.unsplash.com/photo-1519641471654-76ce0107ad1b?q=80&w=1200&auto=format&fit=crop') no-repeat center center;
            background-size: cover;
            min-height: 100%;
        }
        main.flex-grow-1 { padding: 0 !important; margin-top: 0 !important; }
        .navbar { display: none !important; }
        .footer { display: none !important; }
    </style>
</head>
<body class="bg-light">
    <div layout:fragment="content" class="container-fluid min-vh-100 d-flex p-0">
        <div class="row g-0 w-100 flex-grow-1">
            <!-- Left Side Cover -->
            <div class="col-lg-6 d-none d-lg-block auth-cover position-relative">
                <div class="position-absolute w-100 h-100 bg-primary" style="opacity: 0.6; mix-blend-mode: multiply;"></div>
                <div class="position-absolute bottom-0 p-5 text-white z-index-1">
                    <h1 class="display-4 fw-bold mb-3">Welcome Back!</h1>
                    <p class="lead text-white-50">Sign in to manage your bookings, browse our premium fleet, and hit the road.</p>
                </div>
            </div>
            
            <!-- Right Side Form -->
            <div class="col-lg-6 d-flex align-items-center justify-content-center bg-body">
                <div class="w-100 px-4 px-md-5" style="max-width: 500px;" data-aos="fade-up">
                    <div class="text-center mb-5">
                        <a th:href="@{/}" class="text-decoration-none d-inline-block mb-4">
                            <h2 class="fw-bold"><i class="fa-solid fa-car-side text-primary me-2"></i>Ride<span class="text-primary">Easy</span></h2>
                        </a>
                        <h3 class="fw-bold">Sign In to Your Account</h3>
                        <p class="text-muted">Don't have an account? <a th:href="@{/register}" class="text-primary fw-bold text-decoration-none hover-lift d-inline-block">Sign up</a></p>
                    </div>

                    <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center" role="alert">
                        <i class="fa-solid fa-circle-exclamation me-2"></i>
                        <div>Invalid username or password.</div>
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center" role="alert">
                        <i class="fa-solid fa-circle-check me-2"></i>
                        <div>You have been logged out successfully.</div>
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="form-floating mb-4">
                            <input type="email" id="username" name="username" class="form-control bg-light border-0 shadow-none" placeholder="name@example.com" required>
                            <label for="username" class="text-muted">Email address</label>
                        </div>
                        
                        <div class="form-floating mb-4 position-relative">
                            <input type="password" id="password" name="password" class="form-control bg-light border-0 shadow-none pe-5" placeholder="Password" required>
                            <label for="password" class="text-muted">Password</label>
                            <button type="button" id="togglePassword" class="btn position-absolute top-50 end-0 translate-middle-y text-muted shadow-none border-0 px-3 z-3">
                                <i class="fa-solid fa-eye"></i>
                            </button>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-5">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input shadow-none cursor-pointer" id="remember">
                                <label class="form-check-label text-muted user-select-none cursor-pointer" for="remember">Remember me</label>
                            </div>
                            <a href="#" class="text-primary text-decoration-none small fw-bold">Forgot password?</a>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold rounded-pill shadow-sm hover-lift mb-3">Sign In</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
