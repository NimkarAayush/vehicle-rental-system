<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{fragments/layout}" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>404 Not Found</title>
</head>
<body>
    <div layout:fragment="content" class="d-flex align-items-center justify-content-center py-5">
        <div class="container text-center" data-aos="fade-up">
            <div class="mb-4 text-primary">
                <i class="fa-solid fa-map-location-dot" style="font-size: 100px; filter: drop-shadow(0 10px 15px rgba(79,70,229,0.3));"></i>
            </div>
            <h1 class="display-1 fw-bold text-dark">404</h1>
            <h2 class="h3 mb-4 fw-bold">Page Not Found</h2>
            <p class="text-muted lead mb-5 mx-auto" style="max-width: 500px;">Looks like you took a wrong turn! The page you are looking for doesn't exist or has been moved.</p>
            <a th:href="@{/}" class="btn btn-primary btn-lg rounded-pill px-5 fw-bold hover-lift shadow-sm">
                <i class="fa-solid fa-arrow-left me-2"></i> Back to Homepage
            </a>
        </div>
    </div>
</body>
</html>
