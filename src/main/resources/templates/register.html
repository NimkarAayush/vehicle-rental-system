<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{fragments/layout}" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>Register - RideEasy</title>
    <style>
        .auth-cover {
            background: url('https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?q=80&w=1200&auto=format&fit=crop') no-repeat center center;
            background-size: cover;
            min-height: 100%;
        }
        main.flex-grow-1 { padding: 0 !important; margin-top: 0 !important; }
        .navbar { display: none !important; }
        .footer { display: none !important; }
        .progress { height: 6px; }
    </style>
</head>
<body>
    <div layout:fragment="content" class="container-fluid min-vh-100 d-flex p-0">
        <div class="row g-0 w-100 flex-grow-1 flex-row-reverse">
            <!-- Right Side Cover -->
            <div class="col-lg-6 d-none d-lg-block auth-cover position-relative">
                <div class="position-absolute w-100 h-100 bg-primary" style="opacity: 0.7; mix-blend-mode: multiply;"></div>
                <div class="position-absolute bottom-0 p-5 text-white z-index-1">
                    <h1 class="display-4 fw-bold mb-3">Join the Journey</h1>
                    <p class="lead text-white-50">Create an account to access exclusive deals, manage your bookings, and enjoy a seamless rental experience.</p>
                </div>
            </div>
            
            <!-- Left Side Form -->
            <div class="col-lg-6 d-flex align-items-center justify-content-center bg-body py-5">
                <div class="w-100 px-4 px-md-5" style="max-width: 550px;" data-aos="fade-up">
                    <div class="text-center mb-4">
                        <a th:href="@{/}" class="text-decoration-none d-inline-block mb-4">
                            <h2 class="fw-bold"><i class="fa-solid fa-car-side text-primary me-2"></i>Ride<span class="text-primary">Easy</span></h2>
                        </a>
                        <h3 class="fw-bold">Create an Account</h3>
                        <p class="text-muted">Already have an account? <a th:href="@{/login}" class="text-primary fw-bold text-decoration-none hover-lift d-inline-block">Sign in</a></p>
                    </div>

                    <form th:action="@{/register}" method="post" th:object="${user}">
                        
                        <div class="row g-3 mb-3">
                            <div class="col-sm-6">
                                <div class="form-floating">
                                    <input type="text" id="firstName" th:field="*{firstName}" class="form-control bg-light border-0 shadow-none" th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'" placeholder="First Name">
                                    <label for="firstName" class="text-muted">First Name</label>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                                </div>
                            </div>
                            <div class="col-sm-6">
                                <div class="form-floating">
                                    <input type="text" id="lastName" th:field="*{lastName}" class="form-control bg-light border-0 shadow-none" th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'" placeholder="Last Name">
                                    <label for="lastName" class="text-muted">Last Name</label>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                                </div>
                            </div>
                        </div>

                        <div class="form-floating mb-3">
                            <input type="email" id="email" th:field="*{email}" class="form-control bg-light border-0 shadow-none" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" placeholder="Email address">
                            <label for="email" class="text-muted">Email address</label>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>
                        
                        <div class="form-floating mb-2 position-relative">
                            <input type="password" id="password" th:field="*{password}" class="form-control bg-light border-0 shadow-none pe-5" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" placeholder="Password">
                            <label for="password" class="text-muted">Password</label>
                            <button type="button" id="togglePassword" class="btn position-absolute top-50 end-0 translate-middle-y text-muted shadow-none border-0 px-3 z-3">
                                <i class="fa-solid fa-eye"></i>
                            </button>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>
                        
                        <!-- Password Strength Indicator -->
                        <div class="progress mb-3 rounded-pill bg-light" style="display: none;" id="strengthContainer">
                            <div id="passwordStrength" class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                        
                        <script>
                            document.getElementById('password').addEventListener('focus', function() {
                                document.getElementById('strengthContainer').style.display = 'flex';
                            });
                        </script>

                        <div class="form-floating mb-4">
                            <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control bg-light border-0 shadow-none" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'" placeholder="Confirm Password">
                            <label for="confirmPassword" class="text-muted">Confirm Password</label>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                        </div>
                        
                        <div class="form-check mb-4">
                            <input class="form-check-input shadow-none" type="checkbox" value="" id="terms" required>
                            <label class="form-check-label text-muted small" for="terms">
                                I agree to the <a href="#" class="text-primary text-decoration-none">Terms of Service</a> and <a href="#" class="text-primary text-decoration-none">Privacy Policy</a>
                            </label>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold rounded-pill shadow-sm hover-lift">Create Account</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
