<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{fragments/layout}">
<head>
    <title>Home - Vehicle Rental</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="text-center mb-5">
            <h1 class="display-4 fw-bold">Find Your Perfect Ride</h1>
            <p class="lead text-muted">Choose from our wide selection of premium vehicles for your next journey.</p>
        </div>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <div class="col" th:each="vehicle : ${vehicles}">
                <div class="card h-100 shadow-sm border-0">
                    <img th:src="${vehicle.imageUrl}" class="card-img-top vehicle-img" th:alt="${vehicle.brand + ' ' + vehicle.model}">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h5 class="card-title fw-bold mb-0" th:text="${vehicle.brand + ' ' + vehicle.model}">Brand Model</h5>
                            <span class="badge bg-primary" th:text="${vehicle.type}">TYPE</span>
                        </div>
                        <p class="card-text text-muted mb-3">
                            <i class="fa-solid fa-hashtag me-1"></i> <span th:text="${vehicle.registrationNumber}">REG-123</span>
                        </p>
                        <h4 class="text-success mb-3 fw-bold">
                            $<span th:text="${vehicle.pricePerDay}">0.00</span> <small class="text-muted fs-6 fw-normal">/ day</small>
                        </h4>
                        <a href="#" class="btn btn-outline-primary w-100">View Details</a>
                    </div>
                </div>
            </div>
            
            <div th:if="${#lists.isEmpty(vehicles)}" class="col-12 text-center py-5">
                <h3 class="text-muted">No vehicles available at the moment.</h3>
            </div>
        </div>
    </div>
</body>
</html>
