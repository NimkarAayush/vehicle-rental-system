<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{fragments/layout}" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>Customer Dashboard</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
            <h2 class="fw-bold"><i class="fa-solid fa-user me-2"></i>My Dashboard</h2>
            <span class="badge bg-primary fs-6">Customer Portal</span>
        </div>
        
        <div class="row">
            <div class="col-md-12">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h4 class="card-title">Hello, <span th:text="${currentUser.firstName}">Customer</span>!</h4>
                        <p class="text-muted">Welcome to your dashboard. Your bookings and payment history will appear here once features are implemented.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
