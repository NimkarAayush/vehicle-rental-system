<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{fragments/layout}" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>My Bookings</title>
</head>
<body class="bg-light">
    <div layout:fragment="content" class="container py-5">
        
        <div class="d-flex justify-content-between align-items-end mb-4" data-aos="fade-down">
            <div>
                <h2 class="fw-bold mb-1"><i class="fa-solid fa-calendar-check text-primary me-2"></i>My Bookings</h2>
                <p class="text-muted mb-0">Manage your upcoming and past rentals.</p>
            </div>
            <a th:href="@{/vehicles}" class="btn btn-primary rounded-pill fw-bold px-4 shadow-sm hover-lift">
                <i class="fa-solid fa-plus me-1"></i> New Booking
            </a>
        </div>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <div class="col" th:each="booking, stat : ${bookings}" data-aos="fade-up" th:data-aos-delay="${(stat.index % 3) * 100}">
                <div class="card h-100 shadow-sm border-0 rounded-4 hover-lift">
                    <div class="card-body p-4 d-flex flex-column">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <span class="badge px-3 py-2 rounded-pill shadow-sm" 
                                  th:classappend="${booking.status.name() == 'COMPLETED' ? 'bg-secondary' : (booking.status.name() == 'CANCELLED' ? 'bg-danger' : 'bg-success')}" 
                                  th:text="${booking.status}"></span>
                            <span class="text-muted small fw-bold text-uppercase" th:text="${#temporals.format(booking.createdAt, 'MMM dd, yyyy')}"></span>
                        </div>
                        
                        <h4 class="card-title fw-bold mb-1" th:text="${booking.vehicle.brand + ' ' + booking.vehicle.model}"></h4>
                        <p class="text-muted small mb-3 font-monospace" th:text="${booking.vehicle.registrationNumber}"></p>
                        
                        <div class="bg-light p-3 rounded-4 mb-3 border">
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-muted small fw-bold">Pick-up</span>
                                <span class="fw-bold" th:text="${booking.startDate}"></span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-muted small fw-bold">Return</span>
                                <span class="fw-bold" th:text="${booking.endDate}"></span>
                            </div>
                            <hr class="my-2 border-secondary">
                            <div class="d-flex justify-content-between">
                                <span class="text-muted small fw-bold">Total Price</span>
                                <span class="fw-bold text-accent" th:text="${'$' + booking.totalPrice}"></span>
                            </div>
                        </div>
                        
                        <div class="mt-auto">
                            <a th:href="@{/customer/bookings/{id}(id=${booking.id})}" class="btn btn-outline-primary w-100 rounded-pill fw-bold">View Details</a>
                        </div>
                    </div>
                </div>
            </div>
            
            <div th:if="${#lists.isEmpty(bookings)}" class="col-12 text-center py-5" data-aos="fade-in">
                <div class="bg-white p-5 rounded-4 shadow-sm">
                    <i class="fa-solid fa-calendar-xmark fa-4x text-muted mb-4 opacity-50"></i>
                    <h3 class="fw-bold">No bookings yet</h3>
                    <p class="text-muted">You haven't made any bookings yet. Start your journey today!</p>
                    <a th:href="@{/vehicles}" class="btn btn-primary rounded-pill px-4 hover-lift">Browse Vehicles</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
